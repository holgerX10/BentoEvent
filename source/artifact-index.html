<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bento</title>
<meta name="theme-color" content="#FFF5E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171412" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bento">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============ Tokens (Bento design system) ============
   App shell: fixed top bar + bottom nav, content between. Peach is the one interaction
   signal. Spatial model: tabs move on the x-axis, sheets rise from the bottom, cards and
   the FAB expand into their sheet (container transform), filters fade through. */
:root{
  --primary:#FAD4C0;--primary-ink:#5A2E1C;
  --secondary:#80A1C1;--success:#16A34A;--warning:#D97706;--danger:#DC2626;
  --surface:#FFF5E6;--card:#FFFFFF;--card-2:#FFFBF4;--text:#111827;--muted:#6B6257;--line:#EBDFCF;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px -12px rgba(60,40,20,.18);
  --shadow-lg:0 2px 6px rgba(60,40,20,.08),0 24px 48px -16px rgba(60,40,20,.28);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--font-display:"Outfit","Manrope",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-s:12px;--r:16px;--r-l:24px;
  /* Type scale 12/14/16/20/24/32 — three families, six levels */
  --fs-caption:12px;--fs-label:14px;--fs-body:16px;--fs-heading:20px;--fs-title:24px;--fs-display:32px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --d-short:100ms;--d-med:250ms;--d-long:400ms;--d-xlong:500ms;
  --ease-std:cubic-bezier(.2,0,0,1);--ease-decel:cubic-bezier(.05,.7,.1,1);--ease-accel:cubic-bezier(.3,0,.8,.15);--ease-emph:cubic-bezier(.2,0,0,1);
  --ease-spring:cubic-bezier(.22,1,.36,1);--ease-out:cubic-bezier(.22,1,.36,1);
  /* transitions.dev tokens */
  --resize-dur:300ms;--resize-ease:cubic-bezier(.22,1,.36,1);--check-box:150ms;--check-draw:350ms;--check-uncheck:150ms;--check-ease:cubic-bezier(.22,1,.36,1);--tabs-dur:300ms;--tabs-ease:cubic-bezier(.22,1,.36,1);--badge-dur:300ms;--badge-ease:cubic-bezier(.22,1,.36,1);
  --top-h:56px;--nav-h:68px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --primary:#FAD4C0;--primary-ink:#3B1D10;--surface:#171412;--card:#221E1B;--card-2:#2A2522;--text:#F6EEE4;--muted:#B5A999;--line:#3A332E;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);--shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 48px -16px rgba(0,0,0,.7);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --primary:#FAD4C0;--primary-ink:#3B1D10;--surface:#171412;--card:#221E1B;--card-2:#2A2522;--text:#F6EEE4;--muted:#B5A999;--line:#3A332E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);--shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 48px -16px rgba(0,0,0,.7);color-scheme:dark;
}

/* ============ Base ============ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-gutter:stable;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font);color:var(--text);background:var(--surface);font-size:16px;line-height:1.45;overscroll-behavior-y:none;font-feature-settings:"cv11","ss01";padding-top:var(--top-total,112px);padding-bottom:calc(var(--nav-h) + var(--sab) + var(--s4))}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em;font-family:var(--font-display)}
.t-display{font-family:var(--font-display);font-size:var(--fs-display);font-weight:800;letter-spacing:-.025em;line-height:1.08}
.t-title{font-family:var(--font-display);font-size:var(--fs-title);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.t-heading{font-family:var(--font-display);font-size:var(--fs-heading);font-weight:700;letter-spacing:-.01em;line-height:1.2}
.t-body{font-size:var(--fs-body);font-weight:500;line-height:1.5}
.t-label{font-size:var(--fs-label);font-weight:600;line-height:1.3}
.t-caption{font-size:var(--fs-caption);font-weight:600;line-height:1.3;color:var(--muted)}
.t-num{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:3px solid var(--secondary);outline-offset:2px;border-radius:var(--r-s)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}
[hidden]{display:none !important}
/* Press feedback + ripple state layer (M3) */
.pressable{position:relative;isolation:isolate;transition:transform var(--d-short) var(--ease-std),box-shadow var(--d-med) var(--ease-std),background var(--d-med) var(--ease-std),color var(--d-med) var(--ease-std),border-color var(--d-med) var(--ease-std),opacity var(--d-med)}
.pressable:active{transform:scale(.97)}
.rip{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none;z-index:5}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.12;transform:scale(0);animation:ripple 450ms var(--ease-out) forwards;pointer-events:none;z-index:5}
@keyframes ripple{to{transform:scale(1);opacity:0}}

.progress{position:fixed;top:var(--top-total,112px);left:0;right:0;height:2px;background:var(--primary);transform-origin:0 50%;transform:scaleX(0);z-index:60;pointer-events:none}
@supports (animation-timeline: scroll()){
  .progress{animation:grow linear both;animation-timeline:scroll(root)}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .topbar{animation:lift linear both;animation-timeline:scroll(root);animation-range:0 80px}
  @keyframes lift{to{box-shadow:0 6px 20px -14px rgba(60,40,20,.35)}}
}

/* ============ Top bar ============ */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:var(--sat);background:var(--surface);border-bottom:1px solid var(--line);view-transition-name:topbar}
.topbar .row{height:var(--top-h);display:flex;align-items:center;gap:var(--s2);padding:0 var(--s4);max-width:1100px;margin:0 auto}
.brand{font-family:var(--font-display);display:flex;align-items:center;gap:var(--s2);font-weight:800;font-size:20px;letter-spacing:-.02em;min-width:0}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--primary);display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:5px;flex:0 0 auto}
.brand .mark i{background:var(--primary-ink);border-radius:2px;opacity:.85}
.brand .mark i:first-child{grid-row:span 2}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500;margin-left:var(--s2);white-space:nowrap;font-variant-numeric:tabular-nums}
.count.swap{animation:textswap var(--d-med) var(--ease-out)}
@keyframes textswap{from{opacity:0;translate:0 4px}to{opacity:1;translate:0 0}}
.spacer{flex:1}
.text-btn{flex:0 0 auto;height:36px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.sub{max-width:1100px;margin:0 auto;padding:0 var(--s4)}
.chips{display:flex;gap:var(--s2);overflow-x:auto;scroll-snap-type:x proximity;padding:0 2px 10px;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 94%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;scroll-snap-align:start;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.chip[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text);animation:pop var(--d-med) var(--ease-spring)}
@keyframes pop{from{transform:scale(.92)}to{transform:scale(1)}}
.filt-pill{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 4px 0 12px;border-radius:999px;background:var(--text);color:var(--surface);font-size:12px;font-weight:700;max-width:55%;animation:pop var(--d-med) var(--ease-spring)}
.filt-pill > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filt-pill button{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:inherit;opacity:.85;flex:0 0 auto}
.mrow{display:flex;gap:var(--s2);align-items:center}.mrow .chips{flex:1;min-width:0}
#todayBtn{flex:0 0 auto;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.rtile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r-l);background:var(--card);border:1px solid var(--line);margin:var(--s1) 0 var(--s2);box-shadow:var(--shadow);color:var(--text)}
.rtile .ic{width:44px;height:44px;border-radius:14px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:0 0 auto;transition:transform 200ms var(--ease-out)}
.rtile:hover .ic{transform:rotate(-12deg) scale(1.06)}
.rtile .tx{flex:1;min-width:0}.rtile b{font-family:var(--font-display);display:block;font-size:17px;font-weight:700}
.rtile small{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.rtile .chev{color:var(--muted);flex:0 0 auto}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:40px;margin-bottom:10px}
.search input{border:0;background:none;outline:none;width:100%;font-size:15px;min-width:0}
.search svg{flex:0 0 auto;color:var(--muted)}
.search button{color:var(--muted);display:grid;place-items:center;width:28px;height:28px;border-radius:999px}

/* ============ Content ============ */
main{max-width:1100px;margin:0 auto;padding:var(--s4);view-transition-name:content}
.view{display:none}.view.active{display:block}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:var(--s5) 0 var(--s3)}
.section-h:first-child{margin-top:var(--s1)}
.section-h h2{font-size:var(--fs-heading);font-weight:700;color:var(--text)}
.section-h .meta{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.banner{display:flex;gap:var(--s3);align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px var(--s4);font-size:var(--fs-label);font-weight:600;margin-bottom:var(--s4)}
.banner .pulse{width:8px;height:8px;border-radius:50%;background:var(--warning);flex:0 0 auto}
.banner.ro .pulse{background:var(--secondary)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 30%,transparent)}50%{box-shadow:0 0 0 6px transparent}}

/* Skeleton while the shared list loads */
.skel{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:150px;gap:var(--s3)}
.skel i{border-radius:var(--r-l);background:linear-gradient(100deg,var(--card) 30%,var(--card-2) 50%,var(--card) 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.skel i:first-child{grid-column:span 2}
@keyframes shimmer{to{background-position:-200% 0}}

/* Rail */
.rail{display:flex;gap:var(--s4);overflow-x:auto;scroll-snap-type:x mandatory;padding:var(--s1) var(--s4) var(--s3);margin:0 calc(-1 * var(--s4));scrollbar-width:none;scroll-padding-inline:var(--s4);overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail-item{position:relative;overflow:hidden;scroll-snap-align:start;flex:0 0 min(78vw,360px);height:200px;border-radius:var(--r-l);color:#fff;text-align:left;box-shadow:var(--shadow)}
.rail-item .art{position:absolute;inset:0;z-index:-1}
.rail-item .art img{width:100%;height:100%;object-fit:cover}
.rail-item::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.62));z-index:-1}
.rail-item .in{position:absolute;inset:auto 0 0 0;padding:var(--s4)}
.rail-item .in .h{font-family:var(--font-display);display:block;font-size:20px;font-weight:700;line-height:1.2;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.rail-item .in .sub{display:block;font-size:13px;opacity:.9;margin-top:4px}
.rail-item .cd{font-family:var(--mono);position:absolute;top:var(--s3);left:var(--s3);background:rgba(255,255,255,.92);color:#111827;font-weight:600;font-size:12px;padding:6px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
@supports (animation-timeline: view()){
  .rail-item{animation:rpop linear both;animation-timeline:view(inline);animation-range:cover 0% cover 100%}
  @keyframes rpop{0%{scale:.97;opacity:.85}30%,70%{scale:1;opacity:1}100%{scale:.97;opacity:.85}}
}

/* Bento grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:150px;gap:var(--s4);grid-auto-flow:dense}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:170px}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:180px;gap:var(--s5)}}
.card{position:relative;overflow:hidden;border-radius:var(--r-l);background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(60,40,20,.05);transition:transform 250ms var(--ease-out),box-shadow 300ms var(--ease-out);text-align:left;display:flex;flex-direction:column;justify-content:flex-end;padding:var(--s4);color:#fff}
@media (hover:hover){.card:hover{box-shadow:0 8px 30px rgba(0,0,0,.12);transform:translateY(-4px) scale(1.01)}.card:hover .pill{background:#fff;color:var(--pc)}.card:hover .pill svg{transform:scale(1.15)}}
.card.l{grid-column:span 2;grid-row:span 2}.card.m{grid-column:span 2}
.card .art{position:absolute;inset:0;z-index:-2}
.card .art img{width:100%;height:100%;object-fit:cover;transition:transform 700ms var(--ease-std)}
.card:hover .art img{transform:scale(1.05)}
.card .veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.66))}
.card .title{font-family:var(--font-display);font-weight:700;font-size:var(--fs-body);line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.card.l .title{font-size:var(--fs-title)}.card.m .title{font-size:var(--fs-heading)}
.card .sub{font-size:var(--fs-caption);font-weight:600;opacity:.9;margin-top:4px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .top{position:absolute;top:var(--s3);left:var(--s3);right:var(--s3);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--pc,var(--secondary));color:#fff;letter-spacing:.01em}
.pill svg{width:12px;height:12px;transition:transform 200ms var(--ease-out)}
.pill{transition:background 200ms var(--ease-out),color 200ms var(--ease-out)}
.card .date{font-family:var(--mono);font-weight:600;font-size:12px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.92);color:#111827;font-variant-numeric:tabular-nums;white-space:nowrap}
.card.soon .date{background:var(--primary);color:var(--primary-ink)}
.card.past{filter:saturate(.4);opacity:.75}
.card.add{border:2px dashed var(--line);background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--muted);font-weight:600;gap:6px}
.card.add:hover{border-color:var(--secondary);color:var(--text)}
.card.flash,.tl-item.flash{animation:flash 1.2s var(--ease-decel) both}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--primary),var(--shadow)}30%{box-shadow:0 0 0 6px var(--primary),var(--shadow-lg)}100%{box-shadow:0 0 0 0 transparent,var(--shadow)}}
.card.leaving,.tl-item.leaving{animation:leave var(--d-med) var(--ease-accel) both}
@keyframes leave{to{opacity:0;transform:scale(.85)}}
@supports (animation-timeline: view()){
  .grid .card{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 40%}
  @keyframes rise{from{opacity:.5;translate:0 14px}to{opacity:1;translate:0 0}}
  .grid.enter .card{animation:rise linear both,enter var(--d-long) var(--ease-out) both;animation-timeline:view(),auto;animation-delay:0s,calc(var(--i,0) * 25ms)}
}
@supports not (animation-timeline: view()){.grid.enter .card{animation:enter var(--d-long) var(--ease-out) both;animation-delay:calc(var(--i,0) * 25ms)}}
@keyframes enter{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
.grid.reveal,.tl.reveal{animation:skelreveal var(--d-long) var(--ease-out) both}
@keyframes skelreveal{from{opacity:0}to{opacity:1}}

/* Timeline */
.monthbar{position:sticky;top:var(--top-total,112px);z-index:40;margin:0 calc(-1 * var(--s4)) var(--s3);padding:var(--s2) var(--s4);background:var(--surface)}
.monthbar .chips{mask-image:none;padding-bottom:0}
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--line);border-radius:2px}
.tl-month{position:relative;scroll-margin-top:calc(var(--top-total,112px) + 64px);padding-top:var(--s5)}
.tl-month:first-of-type{padding-top:0}
.tl-month > h2{font-size:var(--fs-title);font-weight:800;letter-spacing:-.02em;margin:0 0 var(--s3);position:relative}
.tl-month > h2::before{content:"";position:absolute;left:-25px;top:10px;width:12px;height:12px;border-radius:50%;background:var(--text);outline:4px solid var(--surface)}
.tl-month > h2 small{display:block;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:2px}
.tl-list{display:grid;gap:var(--s4)}
.tl-item{position:relative;isolation:isolate;scroll-margin-top:calc(var(--top-total,112px) + 64px);display:grid;grid-template-columns:56px 1fr;gap:var(--s3);background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:var(--s3);box-shadow:0 1px 2px rgba(60,40,20,.05);transition:transform 250ms var(--ease-out),box-shadow 300ms var(--ease-out);text-align:left;width:100%;overflow:visible}
@media (hover:hover){.tl-item:hover{box-shadow:0 8px 30px rgba(0,0,0,.1);transform:translateY(-2px) scale(1.005)}.tl-item:hover .pill svg{transform:scale(1.15)}}
.tl-item::before{content:"";position:absolute;left:-23px;top:26px;width:8px;height:8px;border-radius:50%;background:var(--c,var(--secondary));outline:3px solid var(--surface)}
.tl-item .day{display:grid;place-items:center;align-content:center;border-radius:var(--r);font-variant-numeric:tabular-nums;line-height:1}
.tl-item .day b{font-family:var(--font-display);font-size:24px;font-weight:800}
.tl-item .day span{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:3px}
.tl-item.soon .day{background:var(--primary);color:var(--primary-ink)}
.tl-item.soon .day span{color:var(--primary-ink)}
.tl-item .body{min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center}
.tl-item .body .h{font-family:var(--font-display);font-size:17px;font-weight:700;line-height:1.25}
.tl-item .body .sub{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.tl-item .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.tl-item .cd{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-item .thumb{width:56px;height:56px;border-radius:var(--r-s);object-fit:cover;align-self:center}

/* ============ Bottom nav + FAB ============ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;padding-bottom:var(--sab);background:var(--surface);border-top:1px solid var(--line);view-transition-name:bottombar}

.nav-item .badge{position:absolute;top:10px;right:calc(50% - 30px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums;animation:badge var(--badge-dur) var(--badge-ease) both;z-index:2}

.fab{width:60px;height:60px;border-radius:20px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;margin:0 auto;transform:translateY(-14px);box-shadow:0 10px 24px -8px rgba(90,46,28,.45),0 2px 0 rgba(90,46,28,.1);transition:transform var(--d-med) var(--ease-spring),box-shadow var(--d-med) var(--ease-std),opacity var(--d-med)}

@media (min-width:900px){.nav .row{max-width:1100px;padding:0 var(--s4)}}

/* ============ Sheets (fixed layers, own scrim; no top layer so the morph can start on the same frame as the tap) ============ */
dialog{border:0;padding:0;margin:0;background:transparent;color:var(--text);position:fixed;inset:0;width:100%;max-width:none;height:100%;max-height:none;overflow:visible;z-index:90;align-items:flex-end;justify-content:center}

dialog.on .scrim{opacity:1}
dialog.bd-out .scrim,dialog.closing .scrim,dialog.out .scrim{opacity:0;transition:opacity 220ms var(--ease-out)}
html.lock{overflow:hidden}
@media (max-width:639px){#detail .sheet,#editor .sheet{height:94%}}
.sheet .scroll{display:flex;flex-direction:column}
#detailBody .fade-in{display:flex;flex-direction:column;flex:1}
#detailBody .fade-in .sheet-foot{margin-top:auto}
.sheet{position:relative;width:100%;display:flex;flex-direction:column;max-height:94%;background:var(--card);border-radius:var(--r-l) var(--r-l) 0 0;box-shadow:var(--shadow-lg);will-change:transform,opacity;touch-action:none;backface-visibility:hidden}
@media (min-width:640px){.sheet{max-width:560px;border-radius:var(--r-l);max-height:90%}}

dialog.settle .sheet{transition:transform var(--d-long) var(--ease-spring),opacity var(--d-med)}
@keyframes sheet-in{from{transform:translateY(48px);opacity:.5}to{transform:none;opacity:1}}
@keyframes sheet-out{from{transform:none;opacity:1}to{transform:translateY(60px);opacity:0}}
/* FLIP morph (App Store-style card expand): a clone of the card flies to the hero while the sheet fades in */
.morph-clone{position:fixed;z-index:95;overflow:hidden;pointer-events:none;color:#fff;isolation:isolate;transform-origin:0 0;will-change:transform;backface-visibility:hidden}
.morph-clone .inner{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.morph-clone .inner .art{position:absolute;inset:0;z-index:-2}
.morph-clone .art img{width:100%;height:100%;object-fit:cover}
.morph-clone .inner .veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.66))}
.morph-clone .inner .pill{position:absolute;top:12px;left:12px}
dialog.prep .sheet{opacity:0;animation:none !important}
dialog.prep .hero h3,dialog.prep .fade-in > *{animation-play-state:paused}
dialog.rise .sheet{animation:none !important;opacity:1;transition:opacity 220ms var(--ease-out)}
dialog.out .sheet{animation:none !important;opacity:0;transition:opacity 150ms var(--ease-out)}
@keyframes sheet-fade{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}
@media (min-width:640px){dialog[open] .sheet{animation:modal-in var(--d-long) var(--ease-out) both}@keyframes modal-in{from{opacity:0;scale:.96;translate:0 8px}to{opacity:1;scale:1;translate:0 0}}}
.sheet .scroll{overflow-y:auto;overscroll-behavior:contain;padding:0 var(--s4) var(--s4);touch-action:pan-y;scrollbar-width:thin}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0;flex:0 0 auto}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:var(--s3) var(--s4);flex:0 0 auto;gap:var(--s2)}
.sheet-h h2{font-size:18px;font-weight:800;flex:1}
.close{margin-left:auto;width:36px;height:36px;border-radius:999px;display:grid;place-items:center;background:var(--card-2);color:var(--muted)}
.close svg{transition:transform var(--d-med) var(--ease-spring)}
.close:hover svg{transform:rotate(90deg)}
.fade-in > *{animation:enter var(--d-med) var(--ease-out) both;animation-delay:calc(var(--i,0) * 30ms + 40ms)}
.hero{height:300px;border-radius:var(--r-l);overflow:hidden;position:relative;color:#fff;display:flex;align-items:flex-end;padding:var(--s4) var(--s4) 20px;isolation:isolate;margin:0 calc(-1 * var(--s4)) var(--s4)}
#detail .scroll{padding-top:0;display:flex;flex-direction:column;flex:1 1 auto}
#detail .fade-in{display:flex;flex-direction:column;flex:1}
#detail .sheet-foot{margin-top:auto;padding-top:var(--s4)}
.sheet-h.over{position:absolute;top:0;left:0;right:0;z-index:3;pointer-events:none;padding:var(--s4);justify-content:flex-end}
.sheet-h.over .grab{position:absolute;top:10px;left:50%;translate:-50% 0;margin:0;background:rgba(255,255,255,.7);pointer-events:auto;width:48px;height:5px}
.sheet-h.over .close{pointer-events:auto;background:rgba(255,255,255,.92);color:#111827;margin-left:var(--s2);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.hero .hin{position:relative;display:grid;gap:var(--s2);justify-items:start;width:100%}
.hero .hsub{font-size:14px;font-weight:600;opacity:.92;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.bigrow{display:flex;align-items:baseline;gap:10px;margin-bottom:var(--s4)}
.bigrow b{font-family:var(--font-display);font-size:48px;font-weight:800;letter-spacing:-.03em;line-height:1;display:inline-flex;font-variant-numeric:tabular-nums}
.bigrow b i{font-style:normal;display:inline-block;animation:numpop var(--d-long) var(--ease-out) both;animation-delay:calc(var(--i,0) * 70ms + 120ms)}
.bigrow span{color:var(--muted);font-size:15px;font-weight:600}
.tiles{display:flex;gap:var(--s2);margin-bottom:var(--s4)}
.tile{flex:1;display:grid;justify-items:center;gap:6px;padding:12px 6px;border-radius:16px;border:1px solid var(--line);background:var(--card-2);font-size:12px;font-weight:700;color:var(--muted);text-align:center;min-width:0;transition:background 200ms,color 200ms,border-color 200ms}
.tile svg{width:20px;height:20px}
.tile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tile.ok{color:var(--success)}.tile.warn{color:var(--warning)}.tile.on{background:var(--text);color:var(--surface);border-color:var(--text)}.tile.claim.on{background:var(--secondary);border-color:var(--secondary);color:#fff}
.tile.bump{animation:pop var(--d-med) var(--ease-spring)}
.pop{position:absolute;top:64px;right:var(--s4);z-index:4;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:6px;display:none;transform-origin:top right}
.pop.on{display:grid;animation:pop var(--d-med) var(--ease-spring)}
.pop button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;text-align:left;width:100%;color:var(--text)}
.pop button:hover{background:var(--card-2)}
.pop button.danger{color:var(--danger)}
.pop button svg{color:var(--muted);flex:0 0 auto}.pop button.danger svg{color:inherit}
.note-p{font-size:15px;line-height:1.5;margin:0 0 var(--s4);white-space:pre-wrap;overflow-wrap:anywhere}
.note-p a{color:var(--secondary);font-weight:600}
.login-box{display:grid !important;gap:10px;cursor:default;align-items:stretch}
.login-box .tx small b{display:inline;font-size:inherit;color:var(--text)}
.login-box .code-in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;font:700 26px/1 var(--font-mono,monospace);letter-spacing:10px;text-align:center;color:var(--text);font-variant-numeric:tabular-nums}
.login-box .code-in.err{border:2px solid var(--danger)}
.login-msg{color:var(--muted);font-weight:600;min-height:1em}
.login-links{display:flex;justify-content:space-between}
.about{margin:var(--s2) 0 0;font-size:12px;color:var(--muted);font-weight:600;text-align:center}
.hero .art{position:absolute;inset:-20% 0 0 0;z-index:-2}
.hero .art img{width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.65))}
.hero h3{font-size:var(--fs-display);font-weight:800;line-height:1.08;letter-spacing:-.025em;text-shadow:0 1px 10px rgba(0,0,0,.35);animation:textrise var(--d-long) var(--ease-out) 120ms both}
@keyframes textrise{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
@supports (animation-timeline: scroll()){
  .hero .art{animation:parallax linear both;animation-timeline:scroll(nearest);animation-range:0 240px}
  @keyframes parallax{to{transform:translateY(60px)}}
}
.kv{display:grid;grid-template-columns:28px 1fr;gap:var(--s2) var(--s3);align-items:start;margin-bottom:var(--s4)}
.kv svg{color:var(--muted);margin-top:2px}
.kv .v{font-size:var(--fs-body);font-weight:500;overflow-wrap:anywhere}
.kv .v a{color:var(--secondary);font-weight:600}
.kv .v small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.big-cd{display:flex;align-items:baseline;gap:8px;margin-bottom:var(--s4);padding:var(--s3) var(--s4);background:var(--card-2);border:1px solid var(--line);border-radius:var(--r)}
.big-cd b{font-family:var(--font-display);font-size:var(--fs-display);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:inline-flex}
.big-cd b i{font-style:normal;display:inline-block;animation:numpop var(--d-long) var(--ease-out) both;animation-delay:calc(var(--i,0) * 70ms + 120ms)}
@keyframes numpop{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}
.big-cd span{color:var(--muted);font-size:var(--fs-label);font-weight:600}
.actions{display:flex;gap:var(--s2);flex-wrap:wrap}
.actions .btn{flex:1 1 auto}
.sheet-foot{position:sticky;bottom:0;padding:var(--s3) 0 0;background:linear-gradient(180deg,transparent,var(--card) 35%);display:flex;gap:var(--s2);margin-top:var(--s3)}
.sheet-foot .btn{flex:1}
.confirm{display:none;gap:var(--s2);align-items:center;margin-top:var(--s3);padding:var(--s3);border-radius:var(--r);background:color-mix(in srgb,var(--danger) 8%,transparent);font-size:14px}
.confirm.on{display:flex;animation:enter var(--d-med) var(--ease-decel) both}

/* Buttons */
.btn{position:relative;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;min-height:44px;transition:transform 200ms var(--ease-out),background 200ms var(--ease-out),box-shadow 200ms var(--ease-out),color 200ms}
.btn:active{transform:scale(.95)}
.btn.ok{background:var(--success);color:#fff}
.btn.primary{background:var(--primary);color:var(--primary-ink);box-shadow:0 2px 0 rgba(90,46,28,.12)}
.btn.primary:hover{background:color-mix(in srgb,var(--primary) 85%,#fff)}
.btn.ghost{background:var(--card-2);border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{background:var(--card)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.icon{flex:0 0 44px;padding:0;width:44px}
.btn[disabled]{opacity:.6;cursor:not-allowed}
/* transitions.dev: Matrix dot loader */
.t-matrix{display:grid;grid-template-columns:repeat(3,5px);gap:3px}
.t-matrix i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:matrix 900ms var(--ease-out) infinite;animation-delay:calc(var(--d) * 90ms)}
@keyframes matrix{0%,70%,100%{opacity:.25;transform:scale(.7)}35%{opacity:1;transform:scale(1)}}
/* transitions.dev: Success check */
.t-success{width:18px;height:18px}
.t-success path{stroke-dasharray:var(--check-len,24);stroke-dashoffset:var(--check-len,24);animation:draw var(--check-draw) var(--check-ease) 80ms forwards}

/* ============ Quick add ============ */
.quick{display:grid;gap:var(--s3)}
.paste{position:relative}
.paste textarea{width:100%;min-height:124px;padding-bottom:58px !important;border:2px solid var(--line);background:var(--card-2);border-radius:var(--r);padding:12px 14px;font-size:16px;resize:none;transition:border-color var(--d-med) var(--ease-std),box-shadow var(--d-med) var(--ease-std)}
.paste textarea:focus{outline:none;border-color:var(--secondary);box-shadow:0 0 0 4px color-mix(in srgb,var(--secondary) 22%,transparent)}
.paste textarea.hit{border-color:var(--success);animation:hit var(--d-long) var(--ease-spring)}
@keyframes hit{from{transform:scale(.99)}to{transform:scale(1)}}
.paste-acts{position:absolute;right:10px;bottom:10px;display:flex;gap:var(--s2)}
.mini{height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.mini.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.preview{position:relative;overflow:hidden;border-radius:var(--r-l);height:150px;border:1px solid var(--line);transition:height var(--resize-dur) var(--resize-ease),transform var(--d-med) var(--ease-out);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:var(--s4);box-shadow:var(--shadow);transition:transform var(--d-med) var(--ease-spring)}
.preview.has-img{height:220px}
.preview.bump{animation:pop var(--d-med) var(--ease-out)}
.preview .art{position:absolute;inset:0;z-index:0}
.preview .art img{width:100%;height:100%;object-fit:cover}
.preview .veil{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.66))}
.preview .top,.preview .title,.preview .sub{position:relative;z-index:2}
.preview .top{position:absolute;top:var(--s3);left:var(--s3);right:var(--s3);display:flex;justify-content:space-between;gap:8px}
.preview .title{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.2;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.preview .sub{font-size:13px;opacity:.9;margin-top:4px}
.preview .date{font-weight:700;font-size:12px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.92);color:#111827;white-space:nowrap}
.preview .date.need{background:var(--warning);color:#fff}
.need-row{display:grid;gap:var(--s3);animation:enter var(--d-med) var(--ease-decel) both}
.catpick{display:flex;gap:8px;flex-wrap:wrap;animation:enter var(--d-med) var(--ease-decel) both}
.catpick[hidden]{display:none}
.preview .pill{pointer-events:auto;cursor:pointer}
.catpick button{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--muted)}

.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--d-long) var(--ease-emph)}
.more.open{grid-template-rows:1fr}
.more > div{overflow:hidden;min-height:0}
.link-btn{font-size:var(--fs-label);font-weight:600;color:var(--muted);padding:8px 0;display:inline-flex;align-items:center;gap:6px;justify-self:center}
.link-btn svg{transition:transform var(--d-med) var(--ease-out)}
.link-btn[aria-expanded="true"] svg{transform:rotate(180deg)}

/* Form */
form.f{display:grid;gap:var(--s3)}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card-2);border-radius:var(--r-s);padding:11px 12px;font-size:16px;transition:border-color var(--d-med) var(--ease-std),box-shadow var(--d-med) var(--ease-std)}

<script>
(() => {

/* ---------- Categories ---------- */
const CATS = {

/* ---------- Dates (sv-SE) ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

  if (!ev.date) return ev.endDate ? `t.o.m. ${nodot(fmtShort.format(parseISO(ev.endDate)))}` : 'Datum saknas';
  if (kindOf(ev) === 'fran') { const d = daysUntil(ev.date); return d > 1 ? `premiär om ${d} dagar` : d === 1 ? 'premiär imorgon' : d === 0 ? 'premiär idag' : 'går nu'; }
  const d = daysUntil(ev.date), end = ev.endDate ? daysUntil(ev.endDate) : d;
  if (d < 0 && end >= 0) return 'Pågår nu';
  if (d === 0) return 'Idag'; if (d === 1) return 'Imorgon';
  if (d < 0) { const a=-d; return a===1 ? 'Igår' : a<30 ? `för ${a} dagar sedan` : a<365 ? `för ${Math.round(a/30)} mån sedan` : 'för länge sedan'; }
  if (d < 14) return `om ${d} dagar`; if (d < 60) return `om ${Math.round(d/7)} veckor`; if (d < 365) return `om ${Math.round(d/30)} månader`;

  $('#shareHint').textContent = SUPA && supa.list ? 'Alla med länken kan gå med i listan och lägga till kort' : state.mode === 'db' ? 'Dela sidan uppe till höger. Contributor kan lägga till kort.' : SUPA ? 'Logga in först så får du en inbjudningslänk' : 'Korten ligger bara här. Dela som text eller JSON.';
  const up = sorted().filter(e => !isPast(e));
  $('#shareText').value = up.length ? up.map(e => `• ${shortDate(e)}${e.time?` kl ${e.time}`:''} – ${e.title}${e.venue?` (${e.venue})`:''}`).join('\n') : 'Inga kommande kort.';
  $('#exportJson').value = JSON.stringify({ app: 'bento', version: 1, exported: new Date().toISOString(), events: sorted().map(({ image, ...rest }) => rest) }, null, 1);
  const sel = $('#siteSel');
  sel.innerHTML = (up.length ? up : [{ id:'', title:'Exempelkort' }]).map(e => `<option value="${esc(e.id)}">${esc(e.title)}</option>`).join('');
  renderSnippet();
  document.querySelectorAll('#share .acc').forEach(a => { a.classList.remove('open'); a.querySelector('[data-acc]').setAttribute('aria-expanded','false'); });
  openSheet($('#share'), fromEl, 'fab');
}
function renderSnippet(){
  const ev = state.events.find(e => e.id === $('#siteSel').value) || { title:'Namn på evenemanget', date: todayISO(), time:'19:00', venue:'Plats', city:'Stad', url:'https://', category:'konsert' };
  const card = cardText(ev); const url = location.href.split('#')[0];
  $('#siteSnippet').value = `<a href="${url}#add" target="_blank" rel="noopener" class="bento-save" data-bento="${card.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/\n/g,'&#10;')}" style="display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:#FAD4C0;color:#5A2E1C;font:600 14px system-ui,sans-serif;text-decoration:none">＋ Spara i Bento</a>\n<script>document.querySelectorAll('.bento-save').forEach(a=>a.addEventListener('click',()=>navigator.clipboard.writeText(a.dataset.bento).catch(()=>{})))<\/script>`;
}
async function copyFrom(sel){ const el = $(sel); try { await navigator.clipboard.writeText(el.value); toast('Kopierat'); } catch { toast('Kunde inte kopiera'); } }
async function importJson(file){
  try {
    const data = JSON.parse(await file.text()); const list = Array.isArray(data) ? data : data.events; if (!Array.isArray(list)) throw new Error('format');
    let n = 0;
    for (const raw of list) {
      if (!raw || !raw.title || !/^\d{4}-\d{2}-\d{2}$/.test(raw.date || '')) continue;
      await store.save({ id: String(raw.id || uid()).replace(/[^A-Za-z0-9_\-.~:@+]/g,'-'), title: String(raw.title).slice(0,90), category: CATS[raw.category] ? raw.category : 'annat', date: raw.date, time: raw.time || '', endDate: raw.endDate || '', venue: raw.venue || '', city: raw.city || '', url: raw.url || '', note: String(raw.note||'').slice(0,600), size: ['s','m','l'].includes(raw.size) ? raw.size : 's', image: typeof raw.image === 'string' && raw.image.startsWith('data:image/') ? raw.image : '', by: raw.by || state.me || '', createdAt: raw.createdAt || new Date().toISOString() }); n++;
    }
    toast(n ? `${n} kort inlästa` : 'Inga kort i filen'); closeSheet($('#share'));
  } catch { toast('Kunde inte läsa filen'); }
}

/* ---------- Search ---------- */
let qT; document.addEventListener('input', e => { if (e.target.id !== 'q') return; clearTimeout(qT); const v = e.target.value; $('#qClear').hidden = !v; qT = setTimeout(() => { state.q = v; refilter(); const n = visible().length; const b = $('#filter .sheet-foot .primary'); if (b) b.textContent = `Visa ${n} kort`; }, 120); });
/* ---------- Mer ---------- */
const LS_THEME = 'bento.theme';
function setTheme(v){ if (v === 'auto' || !v) { html.removeAttribute('data-theme'); } else html.dataset.theme = v; lsSet(LS_THEME, v || 'auto'); document.querySelectorAll('#themeSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === (v || 'auto')))); }
function openMenu(fromEl){ setTheme(lsGet(LS_THEME) || 'auto'); supaUI(); $('#about').textContent = `Bento · ${state.events.length} kort · ${state.mode === 'db' ? 'delad lista' : 'sparas i den här webbläsaren'}`; openSheet($('#menu'), fromEl, 'fab'); }

/* ---------- Toast ---------- */
let toastT, toastOnAct = null;
function toast(msg, opts={}){
  const t = $('#toast'), act = $('#toastAct'), bar = $('#toastBar'); const ms = opts.ms || (opts.action ? 5000 : 2000);
  $('#toastText').textContent = msg; act.hidden = !opts.action; act.textContent = opts.action || ''; toastOnAct = opts.onAction || null;
  bar.hidden = !opts.action; t.style.setProperty('--toast-ms', ms + 'ms'); if (opts.action) { bar.innerHTML = '<i></i>'; }
  t.classList.remove('on'); void t.offsetWidth; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => { t.classList.remove('on'); toastOnAct = null; }, ms);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const pop = $('#dmenu'); if (pop.classList.contains('on') && !e.target.closest('#moreDots')) { pop.classList.remove('on'); $('#moreDots').setAttribute('aria-expanded','false'); }
  const t = e.target.closest('button, a, label'); if (!t) return;
  if (t.dataset.view) setView(t.dataset.view);
  else if (t.dataset.open) { if (t.dataset.lp) { delete t.dataset.lp; return; } if (state.sel) toggleSel(t.dataset.open); else openDetail(t.dataset.open, t); }
  else if (t.dataset.cat !== undefined && t.closest('#catChips')) { if (state.filter !== t.dataset.cat) { state.filter = t.dataset.cat; refilter(); } }
  else if (t.dataset.cat !== undefined && t.closest('#catPick')) { draft.category = t.dataset.cat; renderCatPick(); renderPreview(true); $('#catPick').hidden = true; }

  else if (t.hasAttribute('data-close')) closeSheet(t.closest('dialog'));
  else if (t.dataset.copy === '#shareUrl' && SUPA && supa.list && navigator.share) { navigator.share({ title: 'Bento', text: `Häng med i ${supa.list.name} på Bento`, url: supa.inviteUrl() }).catch(() => {}); }
  else if (t.dataset.copy) copyFrom(t.dataset.copy);
  else if (t.dataset.acc) { const a = document.getElementById(t.dataset.acc); const open = !a.classList.contains('open'); a.classList.toggle('open', open); t.setAttribute('aria-expanded', String(open)); }
  else if (t.id === 'fab') openEditor(null, t);
  else if (t.id === 'addCard' || t.hasAttribute('data-new')) openEditor(null, t);
  else if (t.id === 'clearFilter') { state.filter = 'alla'; state.q = ''; state.city = ''; state.by = ''; state.showPast = true; refilter(); }
  else if (t.id === 'navMore') openMenu(t);
  else if (t.id === 'navFind') openFilter(t);
  else if (t.id === 'rndTile') openRnd(t, t.dataset.win);
  else if (t.id === 'mRnd') { closeSheet($('#menu'), true); setTimeout(() => openRnd(), 60); }
  else if (t.id === 'mShare') { closeSheet($('#menu'), true); setTimeout(() => openShare(), 60); }
  else if (t.dataset.theme) setTheme(t.dataset.theme);
  else if (t.id === 'gLogin') { openMenu(t); setTimeout(() => $('#loginEmail')?.focus(), 450); }
  else if (t.id === 'loginBtn' || t.id === 'resendBtn') { const em = t.id === 'resendBtn' ? lsGet(LS_LOGIN_EMAIL) : ($('#loginEmail').value || '').trim().toLowerCase(); const msg = $('#loginMsg'); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em || '')) { msg.textContent = 'Skriv en giltig e-postadress.'; return; } t.disabled = true; msg.textContent = 'Skickar …'; supa.signIn(em).then(() => { lsSet(LS_LOGIN_EMAIL, em); supaUI(); setTimeout(() => $('#loginCode')?.focus(), 60); if (t.id === 'resendBtn') $('#loginMsg').textContent = 'Nytt mejl skickat.'; }).catch(e => { t.disabled = false; msg.textContent = /rate|seconds/i.test(e.message||'') ? 'Vänta en minut innan du ber om ett nytt mejl.' : 'Gick inte. Försök igen.'; }); }
  else if (t.id === 'codeBtn') { const code = ($('#loginCode').value || '').replace(/\D/g, ''); const msg = $('#loginMsg'); if (code.length < 6) { msg.textContent = 'Koden har 6 siffror.'; $('#loginCode').classList.add('err'); return; } t.disabled = true; msg.textContent = 'Loggar in …'; supa.verify(lsGet(LS_LOGIN_EMAIL), code).catch(() => { t.disabled = false; $('#loginCode').classList.add('err'); msg.textContent = 'Fel eller gammal kod. Be om en ny om den är äldre än en timme.'; }); }
  else if (t.id === 'otherEmail') { lsSet(LS_LOGIN_EMAIL, null); supaUI(); setTimeout(() => $('#loginEmail')?.focus(), 60); }
  else if (t.id === 'signOut') supa.signOut();
  else if (t.dataset.list) supa.switchList(t.dataset.list);
  else if (t.id === 'moreDots') { const on = !$('#dmenu').classList.contains('on'); $('#dmenu').classList.toggle('on', on); t.setAttribute('aria-expanded', String(on)); }
  else if (t.id === 'pasteBtn') { (navigator.clipboard && navigator.clipboard.readText ? navigator.clipboard.readText() : Promise.reject()).then(txt => { if (txt && txt.trim()) { $('#paste').value = txt.trim(); applyQuick(); } else toast('Urklippet är tomt'); }).catch(() => { $('#paste').focus(); toast('Håll inne i rutan och välj Klistra in'); }); }
  else if (t.id === 'pvCat') { const cp = $('#catPick'); cp.hidden = !cp.hidden; t.setAttribute('aria-expanded', String(!cp.hidden)); }
  else if (t.id === 'tTicket') { const ev = state.events.find(e => e.id === currentId); const order = ['vill','har','saknas']; const cur = ev && ev.ticket || 'vill'; patchEvent(currentId, { ticket: order[(order.indexOf(cur) + 1) % 3] }); }
  else if (t.id === 'tWith') { const r = $('#withRow'); r.hidden = !r.hidden; if (!r.hidden) setTimeout(() => $('#withIn').focus(), 50); }
  else if (t.id === 'tClaim') { const ev = state.events.find(e => e.id === currentId); patchEvent(currentId, { claimBy: ev && ev.claimBy === state.me ? '' : (state.me || 'me') }); }
  else if (t.dataset.rnd) { rndWin = t.dataset.rnd; renderRnd(true); }
  else if (t.id === 'rndAgain') renderRnd(true);
  else if (t.id === 'rndOpen') { if (rndLast) { const id = rndLast.id; closeSheet($('#slumpa'), true); setTimeout(() => openDetail(id, document.querySelector(`.card[data-id="${id}"]`)), 60); } }
  else if (t.dataset.sort) { state.sort = t.dataset.sort; renderFilter(); refilter(); }
  else if (t.dataset.fcat !== undefined) { state.filter = t.dataset.fcat; renderFilter(); refilter(); }
  else if (t.dataset.fcity !== undefined) { state.city = t.dataset.fcity; renderFilter(); refilter(); }
  else if (t.dataset.fby !== undefined) { state.by = t.dataset.fby; renderFilter(); refilter(); }
  else if (t.id === 'togglePast') { state.showPast = !state.showPast; renderFilter(); refilter(); }
  else if (t.id === 'filtReset') { state.sort = 'datum'; state.filter = 'alla'; state.city = ''; state.by = ''; state.showPast = true; state.q = ''; renderFilter(); refilter(); }
  else if (t.id === 'filtClear') { state.sort = 'datum'; state.city = ''; state.by = ''; state.showPast = true; state.q = ''; refilter(); }
  else if (t.id === 'markSeen') { newFromOthers().forEach(e => state.seen.add(e.id)); lsSet('bento.seen.v1', [...state.seen]); vt('fade', render); }
  else if (t.id === 'selClose') exitSel();
  else if (t.id === 'selAll') { visible().forEach(e => state.sel.add(e.id)); render(); }
  else if (t.id === 'selShare') { const evs = state.events.filter(e => state.sel.has(e.id)); navigator.clipboard.writeText(evs.map(cardText).join('\n\n')).then(() => toast(`${evs.length} kort kopierade`)).catch(() => toast('Kunde inte kopiera')); exitSel(); }
  else if (t.id === 'selSeen') { state.sel.forEach(id => state.seen.add(id)); lsSet('bento.seen.v1', [...state.seen]); exitSel(); }
  else if (t.id === 'selDel') { const ids = [...state.sel]; exitSel(); removeCard(ids); }
  else if (t.dataset.mig) { migChoice = t.dataset.mig; document.querySelectorAll('[data-mig]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mig === migChoice))); }
  else if (t.id === 'migLater') { lsSet('bento.migrate.dismissed', Date.now()); closeSheet($('#migrate')); }
  else if (t.id === 'migGo') { if (migChoice === 'shared') migrateLocal(); else { lsSet('bento.migrate.dismissed', Date.now()); closeSheet($('#migrate')); } }
  else if (t.id === 'toastAct') { const fn = toastOnAct; toastOnAct = null; $('#toast').classList.remove('on'); clearTimeout(toastT); if (fn) fn(); }
  else if (t.id === 'qClear') { $('#q').value = ''; state.q = ''; t.hidden = true; refilter(); $('#q').focus(); }
  else if (t.id === 'todayBtn') document.getElementById('todayMark')?.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
  else if (t.dataset.ticket) patchEvent(currentId, { ticket: t.dataset.ticket });
  else if (t.dataset.claim) { const ev = state.events.find(e => e.id === currentId); patchEvent(currentId, { claimBy: ev && ev.claimBy === state.me ? '' : (state.me || 'me') }); }
  else if (t.id === 'withSave') { patchEvent(currentId, { with: $('#withIn').value.trim() }); }
  else if (t.id === 'addPhoto') { $('#dmenu').classList.remove('on'); const ev = state.events.find(e => e.id === currentId); if (ev) { openEditor(ev); setTimeout(() => { picking = true; setTimeout(() => { picking = false; }, 60000); $('#f-img').click(); }, 450); } }
  else if (t.dataset.ex) { openEditor(null, t); setTimeout(() => { $('#paste').value = t.dataset.ex; applyQuick(); }, 500); }
  else if (t.id === 'editBtn') { $('#dmenu').classList.remove('on'); const ev = state.events.find(x => x.id === currentId); if (ev) openEditor(ev); }
  else if (t.id === 'delBtn') { $('#dmenu').classList.remove('on'); $('#confirm').classList.add('on'); $('#confirm').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  else if (t.id === 'delNo') $('#confirm').classList.remove('on');
  else if (t.id === 'delYes') { const id = currentId; closeSheet($('#detail'), true); removeCard([id]); }
  else if (t.id === 'copyCard') { $('#dmenu').classList.remove('on'); const ev = state.events.find(x => x.id === currentId); if (ev) navigator.clipboard.writeText(cardText(ev)).then(() => toast('Kopierat')).catch(() => toast('Kunde inte kopiera')); }
  else if (t.id === 'imgClear') { draft.image = ''; draft.imageBlob = null; renderImgPrev(); renderPreview(true); }
  else if (t.id === 'noDate') { draft.noDate = true; draft.date = ''; $('#form').requestSubmit(); }
  else if (t.id === 'pickImg' || t.id === 'pickImg2') { if (!$('#f-img')) return; picking = true; setTimeout(() => { picking = false; }, 60000); $('#f-img').click(); }
  else if (t.id === 'moreBtn') { readForm(); setMore(!$('#more').classList.contains('open')); }
});
$('#form').addEventListener('submit', submitForm);
document.addEventListener('input', e => { if (e.target.id === 'loginCode') { e.target.classList.remove('err'); const v = e.target.value.replace(/\D/g, ''); if (v !== e.target.value) e.target.value = v; if (v.length === 6 && !e.target.dataset.auto) { e.target.dataset.auto = '1'; $('#codeBtn').click(); setTimeout(() => { delete e.target.dataset.auto; }, 1500); } } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'loginEmail') { e.preventDefault(); $('#loginBtn').click(); } if (e.key === 'Enter' && e.target.id === 'loginCode') { e.preventDefault(); $('#codeBtn').click(); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'withIn') { e.preventDefault(); patchEvent(currentId, { with: e.target.value.trim() }); } });
let pT; $('#paste').addEventListener('input', () => { clearTimeout(pT); pT = setTimeout(applyQuick, 90); });
$('#paste').addEventListener('paste', e => { const f = [...(e.clipboardData?.files || [])].find(x => x.type.startsWith('image/')); if (f) { e.preventDefault(); setImage(f); } });
$('#form').addEventListener('input', e => { if (e.target.closest('#more') || e.target.closest('#needRow')) { readForm(); if ($('#n-title')) draft.title = $('#n-title').value.trim(); if ($('#n-date')) draft.date = $('#n-date').value; if (e.target.id === 'f-title' || e.target.id === 'f-date' || e.target.id === 'f-venue') renderPreview(); } });
$('#f-img').addEventListener('change', e => { picking = false; const f = e.target.files && e.target.files[0]; if (f) setImage(f); e.target.value = ''; });
window.addEventListener('focus', () => setTimeout(() => { picking = false; }, 800));
$('#importFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importJson(f); e.target.value = ''; });
$('#siteSel').addEventListener('change', renderSnippet);
document.querySelectorAll('dialog').forEach(d => {
  enableDrag(d);
  d.addEventListener('click', e => { if (e.target === d || e.target.classList.contains('scrim')) closeSheet(d); });
  d.addEventListener('wheel', e => { if (!e.target.closest('.scroll')) e.preventDefault(); }, { passive: false });
  d.addEventListener('touchmove', e => { if (!e.target.closest('.scroll')) e.preventDefault(); }, { passive: false });
  d.addEventListener('cancel', e => { e.preventDefault(); if (picking) return; closeSheet(d); });
  d.addEventListener('close', () => { d.classList.remove('morph','rise','prep','out','closing','bd-out','on');  d.querySelectorAll('.morph-clone').forEach(c => c.remove()); if (d._from && d._from.isConnected) d._from.style.visibility = ''; d._from = null; if (d.id === 'detail' && state.lastFocus && state.lastFocus.isConnected) { try { state.lastFocus.focus({ preventScroll: true }); } catch {} } });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const open = [...document.querySelectorAll('dialog[open]')].pop(); if (open) { e.preventDefault(); closeSheet(open); } else if (state.sel) exitSel(); } });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h === 'add') { location.hash = state.view; openEditor(null, $('#fab')); } else setView(h || 'rutnat', false); });
setInterval(() => { const h = new Date(); if (h.getHours() === 0 && h.getMinutes() === 0) render(); }, 60000);

/* ---------- Tabs sliding indicator ---------- */
function positionSlider(){
  const row = document.querySelector('.nav .row'), sl = $('#navSlider');
  const active = document.querySelector('.nav-item[data-view][aria-pressed="true"] .ind'); if (!active) { sl.style.opacity = '0'; return; }
  const r = active.getBoundingClientRect(), rr = row.getBoundingClientRect();
  sl.style.opacity = '1'; sl.style.width = r.width + 'px'; sl.style.setProperty('--x', (r.left - rr.left) + 'px');
}
window.addEventListener('resize', positionSlider);

/* ---------- Header height drives content offset ---------- */
const topbar = document.querySelector('.topbar');
const measure = () => html.style.setProperty('--top-total', topbar.offsetHeight + 'px');
new ResizeObserver(measure).observe(topbar); measure();

/* ---------- Boot ---------- */
setTheme(lsGet(LS_THEME) || 'auto');
const qs = new URLSearchParams(location.search);
if (qs.get('join')) { lsSet(LS_JOIN, qs.get('join')); history.replaceState(null, '', location.pathname + location.hash); if (SUPA) setTimeout(async () => { const { data: { session } } = await SUPA.auth.getSession(); if (!session) { toast('Logga in för att gå med i listan', { ms: 4000 }); openMenu(); } }, 900); }
const sharedIn = qs.get('share') === '1' || qs.get('text') || qs.get('url') || qs.get('title');
if (sharedIn) history.replaceState(null, '', location.pathname + location.hash);
const h0 = location.hash.slice(1);
const initial = (h0 && h0 !== 'add') ? h0 : (lsGet(LS_VIEW) || 'rutnat');
state.view = VIEWS.includes(initial) ? initial : 'rutnat';
document.querySelectorAll('.view').forEach(s => s.classList.toggle('active', s.id === 'view-' + state.view));
document.querySelectorAll('.nav-item[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
document.fonts?.ready?.then(positionSlider); positionSlider(); setTimeout(positionSlider, 300);
store.init().then(async () => {
  if (h0 === 'add') { location.hash = state.view; setTimeout(() => openEditor(null, $('#fab')), 300); }
  if (sharedIn) {
    const txt = [qs.get('title'), qs.get('text'), qs.get('url')].filter(Boolean).join('\n');
    let file = null;
    if (qs.get('share') === '1' && 'caches' in window) { try { const c = await caches.open('bento-share'); const r = await c.match('/shared-image'); if (r) { file = new File([await r.blob()], 'delad.jpg', { type: r.headers.get('content-type') || 'image/jpeg' }); await c.delete('/shared-image'); } const t = await c.match('/shared-text'); if (t) { const extra = await t.text(); await c.delete('/shared-text'); if (extra && !txt) { setTimeout(() => { $('#paste').value = extra; applyQuick(); }, 500); } } } catch {} }
    setTimeout(() => { openEditor(null, $('#fab')); setTimeout(() => { if (txt) { $('#paste').value = txt; applyQuick(); } if (file) setImage(file); }, 450); }, 300);
  }
  if ('serviceWorker' in navigator && CFG) navigator.serviceWorker.register('/sw.js').catch(() => {});
});
})();
